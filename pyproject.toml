[project]
name = "polen-history"
version = "0.1.0"
description = "Pollen, air quality and weather pipeline for Swedish cities"
readme = "README.md"
authors = [
    { name = "Gaby-projects", email = "gabmavi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dash>=4.4.1",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "gunicorn>=26.2.0",
    "holidays>=0.105",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "truststore>=0.10.4",
    "winotify>=1.1.0 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "altair>=6.3.0",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["dashboard"]  # so tests can `import data` and `import charts` like app.py does
