version: 2

models:
  - name: stg_air_quality
    description: Pollen and pollution per city and hour. One row per city + time_utc.
    data_tests:
      - unique_combination:
          arguments:
            columns: [city, time_utc]
    columns:
      - name: city
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Malmö", "Göteborg", "Stockholm", "Uppsala", "Umeå", "Luleå"]
      - name: time_utc
        description: Hour in UTC (unique per city).
        data_tests: [not_null]
      - name: time_local
        description: Hour in Swedish time (Europe/Stockholm). Repeats once a year when clocks go back.
        data_tests: [not_null]
      - name: alder_pollen
        description: Alder pollen, grains/m³. Empty off-season values filled with 0.
        data_tests: [not_null, not_negative]
      - name: birch_pollen
        description: Birch pollen, grains/m³. Empty off-season values filled with 0.
        data_tests: [not_null, not_negative]
      - name: grass_pollen
        description: Grass pollen, grains/m³. Empty off-season values filled with 0.
        data_tests: [not_null, not_negative]
      - name: mugwort_pollen
        description: Mugwort pollen, grains/m³. Empty off-season values filled with 0.
        data_tests: [not_null, not_negative]
      - name: pm2_5
        description: Fine particles, µg/m³.
        data_tests: [not_null, not_negative]
      - name: pm10
        description: Particles, µg/m³.
        data_tests: [not_null, not_negative]
      - name: ozone
        description: Ozone, µg/m³.
        data_tests: [not_null, not_negative]
      - name: no2
        description: Nitrogen dioxide, µg/m³.
        data_tests: [not_null, not_negative]

  - name: stg_weather
    description: Weather per city and hour. One row per city + time_utc.
    data_tests:
      - unique_combination:
          arguments:
            columns: [city, time_utc]
    columns:
      - name: city
        data_tests: [not_null]
      - name: time_utc
        description: Hour in UTC (unique per city).
        data_tests: [not_null]
      - name: time_local
        description: Hour in Swedish time (Europe/Stockholm).
      - name: temperature_c
        description: Air temperature 2 m above ground, °C.
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: -50, max_value: 40}
      - name: humidity_pct
        description: Relative humidity 2 m above ground, %.
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 0, max_value: 100}
      - name: precipitation_mm
        description: Rain or snow in that hour, mm.
        data_tests: [not_null, not_negative]
      - name: wind_speed_kmh
        description: Wind speed 10 m above ground, km/h.
        data_tests: [not_null, not_negative]
      - name: wind_direction_deg
        description: Direction the wind comes from, degrees (0 = north).
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 0, max_value: 360}
