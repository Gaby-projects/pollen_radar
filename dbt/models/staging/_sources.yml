version: 2

sources:
  - name: raw
    description: Data as it arrives from the APIs, loaded by ingestion/ingest.py. Times in UTC.
    # Freshness: warn if the newest hour is older than 2 days, error after 4 days.
    # Run with: uv run dbt source freshness
    config:
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 4, period: day}
      loaded_at_field: time
    tables:
      - name: air_quality
        description: Pollen and pollution per city and hour (Open-Meteo Air Quality API, CAMS model).
        data_tests:
          - unique_combination:
              arguments:
                columns: [city, time]
      - name: weather
        description: Weather per city and hour (Open-Meteo Historical Weather API).
        data_tests:
          - unique_combination:
              arguments:
                columns: [city, time]
      - name: ingestion_log
        description: One row per city and source per pipeline run.
        config:
          freshness: null  # a log, not data
