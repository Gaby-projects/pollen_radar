name: polen
version: "1.0.0"
profile: polen

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  polen:
    staging:
      +schema: staging
      +materialized: view    # light: always reads the latest raw data
    marts:
      +schema: marts
      +materialized: table   # stored: fast for notebook and dashboard
